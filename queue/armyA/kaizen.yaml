    description: "skill化候補: css-crossfade-via-dual-pseudo。モード切替の「唐突感」を消すため、疑似要素 or 別要素の opacity クロスフェード (1-2秒 ease-out) を採用する設計パターン。cmd_238 で星モード→太陽モードの遷移に sun-orb div を追加し opacity 0→1 で滑らかに切替、星側は opacity 1→0 でフェードアウト。単一要素の keyframes 差し替えでは唐突になる問題を、別レイヤを重ねてクロスフェードすることで解決する汎用手法。状態切替アニメーションの共通パターンとして再利用可能。"
    proposal: "skill: css-crossfade-via-dual-pseudo（状態切替時に別要素/疑似要素を用意し opacity クロスフェードで唐突感を消す設計テンプレ。cmd_238 sun-orb 実装がそのまま流用可能）"


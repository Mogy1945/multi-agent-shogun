entries:
  - id: KZ-154
    timestamp: "2026-04-22T21:00:00Z"
    reporter: karoB (cmd_B035 自律採択実績)
    category: git_hygiene
    priority: low
    description: "cmd_B035 で KZ-151 (skills/ 管理外) と KZ-152 (queue/armyB/ kaizen.yaml 管理外) を .gitignore 方針A(exception 許可)で統合解決した際の意思決定記録。将来の .gitignore 改修判断時のリファレンスとして保管"
    impact: "(1) skill 成果物 (SKILL.md / *.md) が組織知として git 履歴に永続化され、マシン跨ぎ/エージェント跨ぎで参照可能に (2) kaizen.yaml / kaizen_archive.yaml / skill_candidates.md が -f なしで標準 staging 可能に = KZ-140 streak 評価の曖昧さ解消 (3) runtime data (shogun_to_karo.yaml / tasks / reports) は ignore 継続で per-machine 独立性維持 (4) cmd_B033 で導入した force-add 運用が不要化"
    status: resolved
    resolved_at: "2026-04-22T21:00:00Z"
    resolved_by: "本 KZ 自体が cmd_B035 の採択実績記録であり、起票と同時に resolved"
    decision_record:
      option_a_selected: ".gitignore exception 許可 (skills/* + !skills/*/SKILL.md + !skills/*/*.md / queue/army{A,B}/* + !kaizen.yaml + !kaizen_archive.yaml + !skill_candidates.md)"
      option_b_rejected: "ファイル再配置 (meta/armyB_kaizen.yaml 等) — pane_watchdog/archive_done/health_check 等のスクリプトで queue/armyB/ パス参照が多発、影響範囲過大"
      option_c_rejected: "現状維持 — KZ-151/152 未解決、cmd_B033 force-add 運用恒久化で運用不便"
      selection_criteria:
        - "最少差分: .gitignore 数行追加のみで完結"
        - "可逆性: exception 行削除で即戻せる"
        - "影響範囲: scripts/ 配下の grep で影響ゼロ確認済"
        - "組織知の git 永続化: skill 設計・kaizen 履歴が履歴追跡可能"
    references:
      - "KZ-151 (skills/ 管理外) → 本件で完全 resolved"
      - "KZ-152 (queue/armyB/ kaizen.yaml 管理外) → 本件で完全 resolved"
      - "KZ-140 (選択的 staging streak) → 評価基準の曖昧さ解消"
      - "cmd_B033 force-add (skills/SKILL.md) → 本件以降は不要"

  - id: KZ-152
    timestamp: "2026-04-22T20:30:00Z"
    reporter: karoB (cmd_B034 anomaly1)
    category: git_hygiene
    priority: medium
    description: "cmd_B034 手順5『kaizen.yaml を staging』実行時、queue/armyB/ は .gitignore L27 (queue/armyB/) により git 管理外であることが判明。kaizen.yaml/shogun_to_karo.yaml/tasks/*/reports/* 全てが tracked にならず、KZ-140 の『選択的 staging 1ファイル厳守』原則で評価できない。設計意図は runtime data (per-machine) だが、kaizen.yaml は組織知として git 管理すべき資産であり、同じ queue/armyB/ 配下に混在していることが問題の根源"
    impact: "(1) kaizen 履歴が git 共有されず、他マシン/他エージェント/コンパクション後からは Memory MCP か dashboard 経由でしか参照できない (2) KZ-140 streak の評価基準が『staging 1ファイル』だが、kaizen.yaml はそもそも staging 不可でカウント外になる曖昧さ (3) shogun_to_karo.yaml / tasks / reports は runtime で管理外が妥当だが、kaizen.yaml だけは性格が異なる (4) KZ-151 (skills/) と同系統の .gitignore 設計議論"
    proposed_fix: |
      (a) kaizen.yaml の配置を queue/armyB/ 外に移動: 例 `meta/armyB_kaizen.yaml` or `kaizen/armyB.yaml`
      (b) .gitignore の queue/armyB/ を精緻化: `queue/armyB/*` + `!queue/armyB/kaizen.yaml` で kaizen.yaml のみ tracked 化
      (c) 現状維持: kaizen.yaml は各マシンローカルの組織知として運用、共有は Memory MCP + dashboard 経由で継続
      → 殿判断事項。KZ-151 (.gitignore skills/) と併せて .gitignore 全体方針レビューの一部として扱う
    status: resolved
    resolved_at: "2026-04-22T21:00:00Z"
    resolved_by: "cmd_B035 commit (karoB 自律)"
    resolution_note: "2026-04-22 cmd_B035 で .gitignore 方針A(exception許可)統合採択。skills/*/SKILL.md と queue/armyB/{kaizen.yaml,kaizen_archive.yaml,skill_candidates.md} が -f なしで staging 可能になり、組織知が git 履歴に残る運用確立"
    related:
      - "KZ-151 (skills/ 管理外問題) と同系統、.gitignore 設計方針レビューの一部"
      - "KZ-140 (選択的 staging 12連続) の評価基準との整合確認要"
      - "KZ-154 (cmd_B035 adoption 実績) に採択方針A の意思決定根拠を記録"

  - id: KZ-153
    timestamp: "2026-04-22T20:30:00Z"
    reporter: karoB (cmd_B034 anomaly2)
    category: working_tree_hygiene
    priority: low
    description: "cmd_B034 で instructions/karo.md を編集した際、git diff HEAD が +293/-577 という大差分を示した。原因調査の結果、HEAD (cmd_B029 以前のコミット) には CoC TRPG 専門版 (686行) が記録されていたが、working tree は既に短縮版 (402行) に置換されており、長年にわたり未コミット保管されていたことが判明。本 cmd_B034 commit でこの未コミット差分 + Appendix B 追記が合算解消。実害は無し (tcmd_233 活動残滓と推定)、scope 超過ではあるが working tree 健全化の副次効果あり"
    impact: "(1) working tree と HEAD の長期乖離は compaction/ /clear/ マシン移行時に未コミット変更が失われるリスク源 (2) 同種の未コミット差分が他ファイル (instructions/*.md, CLAUDE.md, scripts/*, dashboard_*.md) にも残存している可能性 (3) cmd 実行時の diff 測定が意図外の履歴差分を含むため KZ-140 streak 評価や PR 粒度管理が曇る"
    proposed_fix: |
      (a) 定期的な `git status` + `git diff --stat HEAD` による未コミット差分監視を運用に組み込む
      (b) セッション開始時 or /clear 復帰時の自己点検項目に『working tree vs HEAD 乖離チェック』を追加 (instructions/karo.md + shogun.md)
      (c) 大規模組織改編タスク (tcmd_233 等) 完了直後に working tree の全体健全性を確認する『清算フェーズ』を入れる
      (d) 本件で karo.md は健全化済。他ファイルは次回触るタイミングで発覚する可能性あり、都度検査で足りると判断
    status: resolved
    resolved_at: "2026-04-22T20:15:00Z"
    resolved_by: "cmd_B034 commit d056cfc97f8aa36e1 で副次的に working tree 健全化"
    resolution_note: "karo.md は健全化完了。他ファイルの未コミット差分残存は次回タスクで都度発見・整理。運用ルール追加 (b)(c) は将来の kaizen (KZ-154+) で検討可能、本件単独では close"
    related:
      - "tcmd_233 / cmd_B029 (組織改編時の活動残滓と推定)"
      - "KZ-140 (選択的 staging streak 評価に影響)"

  - id: KZ-150
    timestamp: "2026-04-22T19:50:00Z"
    reporter: karoB (cmd_B032 副産物)
    category: infrastructure
    priority: high
    description: "cmd_B032 実行で shogun-web の server.js は起動モード分岐 (L133-136 production / L140-152 dev Vite middleware) を持つが、現行は Vite dev mode 稼働中。cmd_B031 で build した dist/ hashed assets (office-Ccd1uMss.js 1010KB 等) は dev mode では配信されず 404。一方 public/ 配下は Vite middleware が on-the-fly で変換配信しており cmd_B031 merge 反映済。どちらを『正規運用モード』とするか、及び build→dist の意義付けが不明確"
    impact: "(1) cmd_B031/B032 手順に『新dist 配信確認』が含まれるが dev mode では満たせない → 検証基準が曖昧 (2) build は実行するが dev mode では未使用 → 工数無駄 (3) production mode に切り替える場合は `NODE_ENV=production` 設定やオプション追加手順が必要だが未整備 (4) dev mode のまま運用するなら build ステップを手順から削除すべき"
    proposed_fix: |
      (a) 殿に『shogun-web は dev mode 常用 or production mode 切替』の方針判断を仰ぐ
      (b) dev mode 継続 → cmd_B031 相当タスクの build ステップを削除、merge のみで反映完了とする
      (c) production mode 切替 → server.js 起動フラグ整理 + NODE_ENV=production node server.js + dist 配信確認手順整備。再起動手順に --prod オプションを組み込む
      (d) 両モード併存 → init script で分岐する運用 (dev/prod toggle 設定ファイル)
    status: resolved
    resolved_at: "2026-04-22T19:55:00Z"
    resolution: "大将軍A案(dev mode 継続)採択。殿『数秒ダウンタイム許容・リロードだけでOK』裁可 + public/ 即反映により、dev mode でも体感上 prod 相当の運用が成立することを確認。将来の prod 切替オプションは cmd_B033 で SKILL.md Appendix B (B.1-B.5) に温存 (commit 79639ef)。tcmd_239 クラスタでクローズ"

  - id: KZ-151
    timestamp: "2026-04-22T19:50:00Z"
    reporter: ashigaruB1 (cmd_B031 副産物) + karoB
    category: git_hygiene
    priority: medium
    description: "cmd_B031 で作成した skills/office-layout-symmetric-scaffolding/SKILL.md (258行) と reports/tcmd_239/build.log が、multi-agent-shogun/.gitignore L13 (skills/) と L56 (*.log) により git 管理外になっている。結果: (1) SubAgent が SKILL.md を作成したが `git add` 自体できない (2) KZ-140 の『選択的 staging』が評価できない (3) skill 資産が git 履歴に残らず、他マシン/他エージェントから参照不可"
    impact: "skill 設計書は組織知として git で共有すべきだが、現行 .gitignore により永続化されない。cmd_B031 成果 (SKILL.md 258行) は SubAgent ワークスペース内にあるが、次回 /clear やマシン移行で喪失リスク"
    proposed_fix: |
      (a) .gitignore L13 (skills/) の意図確認: おそらく claude-code のユーザ個別 skills を除外する意図だが、プロジェクト固有の skills/ は別扱いすべき
      (b) .gitignore 修正案: `skills/` → `.claude/skills/` に限定、もしくは `!skills/office-layout-symmetric-scaffolding/` で明示的 include
      (c) build.log 等のログは reports/ 配下に置き、reports/ は別途 .gitignore でルール設定
      (d) 殿に .gitignore 方針確認後 karoB が 1タスクで修正
    status: resolved
    resolved_at: "2026-04-22T21:00:00Z"
    resolved_by: "cmd_B035 commit (karoB 自律)"
    resolution_note: "2026-04-22 cmd_B035 で .gitignore 方針A(exception許可)統合採択。skills/* + !skills/*/SKILL.md + !skills/*/*.md のパターンで SKILL.md と skill 定義系 .md は -f なしで staging 可能に。SKILL.md 以外の生成物 (build.log, *.png 等) は ignore 継続で安全性維持。cmd_B033 の partial_resolved を完全 resolved に昇格"
    history:
      - "2026-04-22T20:00:00Z (cmd_B033): SKILL.md を `git add -f` force-add → commit 79639ef5d で単体救済 (partial_resolved)"
      - "2026-04-22T21:00:00Z (cmd_B035): .gitignore exception で恒久解決 (resolved)。新規 skill 追加時も force-add 不要"
    related:
      - "KZ-152 (queue/armyB/ 管理外) と統合解決"
      - "KZ-154 (cmd_B035 adoption 実績)"

  - id: KZ-149
    timestamp: "2026-04-22T18:15:00Z"
    reporter: ashigaruB1 (cmd_B030 副産物)
    category: infrastructure
    priority: medium
    description: "shogun-web リポジトリは GitHub remote 未設定のためローカルのみで管理されており、cmd_B030 で commit f59b80b は作成したが PR 作成不可。一方 multi-agent-shogun 本体は cmd_B029 で Mogy1945/multi-agent-shogun にフォーク化して PR→merge 運用が確立。shogun-web も同様に Mogy1945 配下にフォーク化することで: (1) PR ベースのレビュー運用統一 (2) 変更履歴の GitHub 可視化 (3) 複数マシン/エージェント間での同期 (4) revert/rollback の簡易化 が可能になる"
    impact: "現状 shogun-web 改修は push 先がないためローカル commit 止まり。複数マシンや殿環境での反映はファイル同期に頼るしかなく、バージョン管理が不透明。大規模改修 (cmd_B030 の 33 files/+1556-1865) で特に顕在化"
    proposed_fix: |
      (a) `gh repo create Mogy1945/shogun-web --private --source=/home/hatan/shogun-web --remote=origin --push` で fork 作成
      (b) armyc-migration ブランチを push → PR 作成
      (c) squash merge で main 反映
      (d) 以降の shogun-web 改修は multi-agent-shogun と同パターン (feature branch → PR → squash merge)
      (e) 本番反映は殿が dist/ ファイルを静的配信サーバに配置するタイミングで実施
    status: wontfix
    closed_at: "2026-04-22T19:50:00Z"
    close_reason: "殿裁可(cmd_B031 2026-04-22)で『shogun-web はローカル運用継続、GitHub remote 不要』と確定。fork 運用化の動機消失。cmd_B031 で main ローカル merge (HEAD 66eeda2 --no-ff) が完遂し、local 単独運用でも運用回せることが実証された。KZ-149 wontfix クローズ。将来殿が方針変更した場合は新規 KZ 起票"

  - id: KZ-148
    timestamp: "2026-04-22T07:43:00Z"
    reporter: ashigaruB1 (cmd_B029 副産物)
    category: automation
    priority: medium
    description: "cmd_B029 で scripts/pane_watchdog.sh / scripts/health_check.sh 等の AGENTS 配列を手動同期した。config/armies.yaml を正 (single source of truth) とし、スクリプト側はループで動的生成できるはず。現状は手動同期しないとドリフトが発生し、軍D追加時にも再度全スクリプト編集が必要"
    impact: "組織再編の度に複数スクリプトで AGENTS 配列を同期する手間とドリフトリスク。N-軍化の障害"
    proposed_fix: "(a) config/armies.yaml から python/yq で armies[*].id を抽出するヘルパ関数 get_armies_from_config() を scripts/common.sh に新設 (b) pane_watchdog.sh / health_check.sh / task_stats.sh 等の AGENTS 配列を get_armies_from_config + ループ生成に置換 (c) CI で『AGENTS 配列が armies.yaml と一致する』テスト追加も選択肢"
    status: open
    action: "cmd_B029 完遂直後は殿判断待ち。次回軍D追加タスク or pane_watchdog.sh 改修タスク発令時に合流。KZ-147 の shutsujin_departure N-軍化と同一方針で統合採用可。KZ-138ルール: 仮期限 2026-05-22 (1ヶ月) までに(a)別タスク起票 (b)deferred降格 のいずれかを決定要"

  - id: KZ-147
    timestamp: "2026-04-22T07:43:00Z"
    reporter: ashigaruB1 (cmd_B029 副産物)
    category: refactor
    priority: medium
    description: "scripts/shutsujin_departure.sh 内の init_shinobi_queues / setup_shinobi / launch_claude_shinobi は cmd_B029 で stub 化したが、将来軍D以降を追加する際は同種の手動拡張が必要。`armies=(A B C D...)` ループに完全統一し、軍ごとの stub を不要にする再構成が望ましい"
    impact: "N-軍化した際、新軍追加の度に shutsujin_departure.sh に setup_XXX / launch_claude_XXX / init_XXX_queues を新設する必要がある。現状は『stub を残す』という妥協で動いているが恒久対応ではない"
    proposed_fix: "(a) init_army_queues(army_id) 関数を1つ定義し、全軍を for ループで init (b) setup_army(army_id) / launch_claude(army_id) 系も同パターン化 (c) stub 関数は削除 (d) config/armies.yaml の armies[*] をループ駆動源にする (KZ-148 と統合可能)"
    status: open
    action: "cmd_B029 完遂直後は殿判断待ち。KZ-148 と統合して『shutsujin_departure.sh N-軍対応』タスクとして起票する方向。KZ-138ルール: 仮期限 2026-05-22 (1ヶ月)"

  - id: KZ-146
    timestamp: "2026-04-22T07:43:00Z"
    reporter: ashigaruB1 (cmd_B029 副産物)
    category: dsl
    priority: low
    description: "cmd_B029 で scripts/resolve_pane.sh に shinobicho/hanzo/sasuke/kotaro の deprecation 分岐を hardcode 追加した。今後組織改編のたびに毎回 hardcode 編集するのは非効率。宣言的な deprecated_ids.yaml (例: `hanzo: ashigaruC1, sasuke: ashigaruC2, kotaro: ashigaruC3, shinobicho: shogunC`) のような mapping を外部化し、resolve_pane.sh はロードして回すだけにする"
    impact: "組織再編の度に resolve_pane.sh を手動編集する工数とミスリスク。DSL 化すれば宣言1行で対応可能"
    proposed_fix: "(a) scripts/deprecated_ids.yaml 新設、old_id → new_id マッピング宣言 (b) resolve_pane.sh は yq/python で読み込み → deprecated id を検出したら new_id に誘導 + warn を出す実装に置換 (c) 将来の組織改編は deprecated_ids.yaml に1行追加するだけ"
    status: open
    action: "low priority。次回 scripts/resolve_pane.sh を触るタスク (組織改編 or ID ルール変更) と合流予定。KZ-138ルール: 仮期限 2026-05-22 (1ヶ月)"

  - id: KZ-145
    timestamp: "2026-04-22T06:50:00Z"
    reporter: ashigaruB1 (cmd_B028 / tcmd_231 副産物)
    category: quality_assurance
    priority: high
    description: "tcmd_230 で13シナリオのモバイルスキップ検証を行ったが、『taunt/armorBreak付与敵を引かない経路欠落』で false negative『再現せず』判定 → 殿が PC Chrome DevTools Console で決定的例外 (render.js:260 statusMap[key]=undefined) を取得し覆した。原因は state.js createInitialStatus() の全21キーと render.js statusMap の登録14キーの差分 (bleed/slow/stun/confusion/taunt/armorBreak/reviveUsed の7キー未登録) が effects.js L533/L559 で付与され次ターン updateStatusTags で TypeError を誘発するが、検証シナリオでそれらの状態異常が付与される経路を組み合わせで網羅していなかった。『再現しないバグ』の典型検証漏れパターン"
    impact: "状態異常系や運依存付与の UI バグは mobile_skip_matrix のような平面網羅では false negative を招く。本件は殿の実機操作+DevTools で救われたが、家老側で気づけないと本番で停止バグが残留する。また silent error (console.error だけ出て機能停止しない) は通常プレイ経路では表面化しにくく、スキップ固着として現れて初めて露見した"
    proposed_fix: |
      『状態異常網羅検証チェックリスト』を新設し、状態異常系や map[key] 参照を含むタスクで必須化する:
      (1) state.js createInitialStatus() で定義されている全キーをリスト化
      (2) render.js statusMap に対応する label/className がある事を CI or lint で verify (キー差分をテストで検出)
      (3) effects.js / ai.js / continuous.js で付与される status effect を grep で洗い出し、検証シナリオに必須で含める
      (4) 付与経路が運依存 (敵のスキル選択) の場合、Playwright で state 直書きで強制付与するシナリオを追加
      (5) silent error (console.error だけ出て機能停止しない) の検証は通常プレイ経路でも同シナリオを回す
    status: adopted
    adopted_at: '2026-04-22T20:20:00Z'
    adopted_by: karoB (cmd_B034)
    adopted_location: 'instructions/karo.md 検証ツール選定ルール R.3 (状態異常網羅検証チェックリスト)'

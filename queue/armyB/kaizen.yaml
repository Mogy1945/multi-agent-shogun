  - id: KZ-144
    timestamp: "2026-04-22T18:45:00Z"
    reporter: ashigaruB1 (cmd_B027 副産物)
    category: tooling_limitation
    priority: medium
    description: "Playwright MCP は User-Agent 書き換え不可 (Linux Chrome UA 固定) のため、実 Safari / Firefox / 実 Android Chrome 特有のバグ (touch event hijacking / viewport specific CSS bug / WebKit固有のJS実行順序 等) を再現する必要があるタスクで物理的制約に当たる。cmd_B027 で殿指摘『モバイルで動かない』bugを検証したが、UA 固定のため実 Safari 再現は不可能 → viewport + TouchEvent dispatch + 状態異常マトリクス網羅で代替証明に留まった。家老がタスク発令時に『UA 依存性の高いbug』かどうか事前判断できる基準が instructions にないと、足軽が Playwright で時間を溶かしてから気づく"
    impact: "モバイル/ブラウザ固有バグのタスク発令時、Playwright MCP の制約を知らずに『実UA で検証せよ』と指示すると達成不可能な要求になる。代替策 (viewport網羅 / 殿実機デバッグ依頼 / BrowserStack 等) への切替判断が遅れる"
    proposed_fix: "instructions/base.md または instructions/karo.md に『Playwright MCP の既知制約と代替策』セクションを新設。(1) UA 固定制約 → viewport + TouchEvent + 状態網羅で代替、実UA必要時は殿実機 Web Inspector 依頼 (2) networkidle 経由の page.goto は Firestore/analytics で never idle → domcontentloaded に固定推奨 (3) 別ポート http.server で Module Cache 回避 (cmd_B022 の学び) を統合して Playwright-MCP-制約マニュアル化"
    status: adopted
    adopted_at: '2026-04-22T20:20:00Z'
    adopted_by: karoB (cmd_B034)
    adopted_location: 'instructions/karo.md 検証ツール選定ルール R.2 (Playwright MCP 既知制約と代替策)'
    action: "KZ-143 (browser stats 判定樹) と統合可能。2026-05-22 までに instructions/karo.md『検証ツール選定ルール』セクションとして新設。KZ-138ルール: 仮期限2026-05-22 (1ヶ月)"

  - id: KZ-143
    timestamp: "2026-04-22T15:00:00Z"
    reporter: karoB (cmd_B026 救出フェーズ観測)
    category: tooling
    priority: medium
    description: "cmd_B026 で SubAgent が battle_sim.mjs (Playwright persistent context 経由30x2勝率統計) を残したが、(1) page.goto networkidle が Firestore/analytics で never idle になりタイムアウト (2) domcontentloaded に緩めても MutationObserver 検知した battleEnded が myHp/enemyHp 1 残しで timeout=true になり完走しない。結局 60戦で ~15分 タイムアウト地獄。KZ-142 の『bit-for-bit vs 統計許容窓』判定樹とは別に、『browser-based 30x2 自体が実行コスト/信頼性ともに割に合わない』という上位の判断が必要"
    impact: "family 系 battle タスクで毎回 30x2 Playwright stats を要求すると 10-15分待ちが発生し、Opus コスト/殿待機時間を圧迫。しかも失敗率高い。代替の単体正確性テスト (cmd_B026 で6/6 PASS + tie-break 1000回) の方が速くて信頼性も高い場合がある"
    proposed_fix: "instructions/karo.md に『検証コスト判断ルール』を追記: (a) 純粋関数ロジックの勝率差は単体テストで代替可 (b) 30x2 browser stats は『勝敗判定/報酬ロジック自体を触る』タスクでのみ要求 (c) setTimeout/async 経路は関数本体diff=0 + 単体テスト + 殿手動smoke test の三層で担保。browser stats はオプション。KZ-142 と併せて『等価性証明の選択肢マトリクス』を明文化"
    status: adopted
    adopted_at: '2026-04-22T20:20:00Z'
    adopted_by: karoB (cmd_B034)
    adopted_location: 'instructions/karo.md 検証ツール選定ルール R.1 (等価性証明マトリクス)'
    action: "KZ-142 と統合して 2026-05-22 までに instructions/karo.md 改修。単独採用なら『browser_stats_attempted: <bool>』フィールドをタスク完了YAMLテンプレに追加し、試行したが断念した場合も明示する運用に。KZ-138ルール: 仮期限2026-05-22 (1ヶ月)"

  - id: KZ-142
    timestamp: "2026-04-21T00:35:00Z"
    reporter: ashigaruB1 (cmd_B025 副産物)
    category: process_improvement
    priority: medium
    description: "『ロジック非改変の証明をどの粒度で要求するか』の判断基準を明文化する。(1) 関数本体 diff=0 — 常に必須 (2) Math.random seed 注入での bit-for-bit 完全一致 — setTimeout/MutationObserver の順序非決定性が絡むと物理的に不可能 (3) 統計的 ±10% 許容 — 実務上はこれで十分。cmd_B025 では同一 seed/設定の runA vs runB でも 1/30 程度しか一致せず bit-for-bit 要求は物理的に達成不可能と判明。『ブラウザ非同期タイマーが絡むバトル』では (1)+(3) の組合せを採用し、(2) を無理に要求しない運用を家老側で判断できる基準が必要"
    impact: "タスク発令時に bit-for-bit を前提条件にすると達成不可能な要求を足軽に押し付け、時間ロス・無理なエスカレーションを招く。cmd_B024 は演出wait のみなので bit-for-bit 達成できたが、cmd_B025 は turn 順序依存が入り不可能になった。判断基準がないと家老/将軍が再現性を誤解する"
    proposed_fix: "instructions/karo.md (or ashigaru.md) に『非改変証明の3段階基準』を追記: (1) 関数本体 diff=0 必須 (2) setTimeout/async が絡まない純粋関数路は bit-for-bit 要求可 (3) ブラウザ非同期タイマー/MutationObserver/Firestore 等が絡む場合は統計±10% 窓 + 関数本体diff=0 を代替許容。ルールとしてタスク発令時に家老が対象範囲を判定して『bit-for-bit 要求可能か』を明示"
    status: open
    action: "cmd_B025 直後は殿緊急不具合対応を優先して未処理。次回 idle 時に家老B主導で instructions/karo.md『タスク分解の五つの問い』セクションに追記。もしくは base.md の共通プロトコルに昇格。KZ-138ルール: 仮期限2026-05-21 (1ヶ月) までに action 決定要"


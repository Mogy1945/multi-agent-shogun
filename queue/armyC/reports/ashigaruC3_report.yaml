    本タスクで発覚した pendingBattle バグは、リファクタ前後ともに存在した 1 年近く潜在していた
    バグ。同種のパターン（sessionStorage/localStorage のフラグ残骸）は他プロジェクトでも
    頻出する。instructions にチェック手順を追記すれば、忍衆・足軽がフロントエンド修正時に
    自律的に該当パターンを検出でき、殿が「何もしていないのにエラーが出る」と報告する前に
    未然防止できる

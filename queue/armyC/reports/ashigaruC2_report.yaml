  - detail（HTML全文）:

  <h3>ver0.4 アップデート内容</h3><p>参加者バトルを全体的に整備し、遊びやすさと見た目を改善しました。</p><h3>ゲームの改善</h3><ul><li><strong>難易度が選べるように</strong>：スタート画面で「弱い／普通／強い」を選択できます。選んだ難易度は次回以降も引き継がれます。</li><li><strong>対戦相手のマッチング改善</strong>：実力の近い相手と当たりやすくなりました。該当者がいない場合はこれまで通り全体から選ばれます。</li><li><strong>敵のトドメ判断が賢く</strong>：命中しづらい状況でのトドメ技を避けるなど、納得感のある動きに調整しました。</li><li><strong>ガチャが5枚同時引きに</strong>：これまで1枚ずつ引いていたガチャが、5枚を一度に並べて選べるようになりました。空きスロットがあれば優先して入れ替えできます。</li><li><strong>ガチャ演出の刷新</strong>：レアリティが段階的に光っていく演出が、カクつきなく滑らかに流れるようになりました。</li><li><strong>防衛ログの通知</strong>：前回ログイン以降にあなたが防衛で戦われた履歴を、ログイン時にまとめて確認できるようになりました。</li><li><strong>状態異常ガイドを追加</strong>：「状態異常を確認」ボタンから全13種の効果を確認できます。「全て／有利／不利」でタブ切り替えも可能です。</li><li><strong>コンボヒント表示</strong>：バトル開始時に、属性の組み合わせなど立ち回りのヒントがワンポイントで表示されます。</li></ul><h3>見た目・操作感の改善</h3><ul><li><strong>ユーザー情報カードが3列表示に</strong>：通算／攻撃／防衛の成績が横並びで一目で比較できるようになりました（スマホでは縦1列に切り替わります）。</li><li><strong>勝率表示の精度アップ</strong>：勝率を小数第1位まで表示。戦績がまだ無い場合は「-」と表示されます。</li><li><strong>通知トーストの見やすさ改善</strong>：情報／成功／警告／エラーの4種で色分けされ、重要度がひと目でわかるようになりました。</li><li><strong>更新履歴の自動反映</strong>：このお知らせ一覧が自動で最新に更新されるようになり、新しいお知らせがすぐ表示されます。</li><li><strong>ご意見フォームを内蔵</strong>：★1〜5の評価とコメントをアプリ内から直接送れるフィードバックフォームを追加しました。</li><li><strong>設定の保存</strong>：BGM音量／SE音量／敵AI難易度の設定が保存され、次回起動時に復元されます。</li><li><strong>全体のデザイン統一</strong>：色・余白・角丸などを共通ルールに揃え、画面全体のまとまりが良くなりました。</li></ul><h3>不具合修正・動作の安定化</h3><ul><li><strong>3列グリッドの崩れを修正</strong>：ユーザー情報カードがPCでも縦積みになってしまう不具合を修正しました。</li><li><strong>内部の整理で動作を軽快化</strong>：読み込みや画面遷移が安定し、長時間プレイでも動作が崩れにくくなりました。</li><li><strong>エラー時の挙動を改善</strong>：通信失敗などが起きても、ゲームが止まらず分かりやすく通知するようにしました。</li></ul><p>今後もより楽しく遊んでいただけるよう改善を続けます。ご意見・ご要望はアプリ内のフィードバックフォームからどうぞ。</p>


      - 初回訪問時のウェルカムガイド / 操作説明 (移動/チャット/絵文字/座る/ゲーム/ホワイトボード)
      - 友達招待UX (URL共有時の初心者フレンドリー化) / ロビー画面の魅力UP

      ## B. コミュニケーション
      - リアクション種類追加・カスタマイズ (現状 1-5キーで5種類のみ)
      - 絵文字の見せ方改善 (アニメーション、サイズ、位置)
      - チャットUI改善 (タイムスタンプ、未読バッジ、検索、@メンション)
      - DM 改善 (履歴、複数同時 etc.) / 音声品質改善 (ノイズキャンセル、エコー対策)
      - スクリーン共有 (Phase 2 で却下した案、再検討余地)
      - ビデオ通話 (オプション、Phase 2 で却下)

      ## C. 世界観・没入感
      - BGM (環境音・ローファイ系、ON/OFF) / 時間帯演出 (朝/昼/夜でマップ装飾変化)
      - 季節演出 (年末年始装飾、夏祭り、桜) / イベント演出 (誕生日・参加人数記念)
      - アバター個性 (帽子・メガネ・服色 等のカスタマイズ)
      - キャラ名前以外の表示 (ステータス・気分絵文字 等)

      ## D. ゲーム要素 (テトリス以外)
      - 簡易ゲーム追加 (オセロ・神経衰弱・ガチャ・大富豪・人狼風 等)
      - 対戦機能 (テトリス対戦、PeerJS で十分可能)
      - スコア共有のSNS風 (ハイスコア通知、月間ランキング)
      - ミニゲーム同時起動 / 隠しイースターエッグ (殿好み、げんしけん原作要素)

      ## E. ホワイトボード強化
      - 図形描画 (テキストのみ→丸/四角/線も) / 画像貼付 (Imgur 等の URL貼付け)
      - 過去履歴閲覧 / 複数ホワイトボード切替
      - 投票・投稿の見やすさ向上 (絵文字リアクション on ホワイトボード) / エクスポート

      ## F. アクセス・参加性
      - スマホ対応強化 (モバイルレイアウト・タッチ操作改善)
      - 接続安定性 (PeerJS再接続強化、TURN サーバー無料採用)
      - 参加上限拡大 (現状 6-8人、SFU検討は規模違いだが)
      - 招待リンクUX (短縮URL・QRコード・SNS共有) / パスワード制部屋 / 音声ON/OFF選択

      ## G. 永続化・データ
      - 入退室ログ (誰がいつ来たか、招待主向け)
      - チャット履歴の保存・検索 (現状揮発、Firestore採用検討)
      - 部室の利用統計 (滞在時間、人気エリア、月間利用者数)
      - 友達リスト・お気に入りユーザー / プロフィール (自己紹介、SNSリンク)

      ## H. 雰囲気・楽しさ
      - 隠し部屋の追加 (現状3個室、もっと冒険的に)
      - 立ち絵の表情変化 (チャット内容で笑顔・驚き) / ペット表示 (画面上を散歩する猫等)
      - ボード・看板にお知らせ
      - 部屋の家具インタラクション拡張 (TVクリックで動画再生・PCクリックでメモ等)

      ## I. 運用・管理
      - 管理者用ダッシュボード (殿inmogy 用、利用統計確認)

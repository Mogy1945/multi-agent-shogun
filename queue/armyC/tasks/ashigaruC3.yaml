    【camp-schedule-app 依頼3: バトルページ初期遷移時「強制離脱しました」誤表示バグ調査+最小修正】

    ■ プロジェクト
    - パス: /home/hatan/camp-schedule-app/
    - 本番: https://camp-schedule-app.vercel.app/battle/
    - 技術: Vanilla JS / Firebase Firestore / onSnapshot リスナー

    ■ 殿からの報告（原文）
    「最初バトルページに入った時、何もしていないのに『強制離脱しました』とか出る」

    ■ 再現手順（想定）
    1. トップページ → バトルボタン → /battle/index.html
    2. 初回ロード直後、ユーザーが何も操作していない瞬間に離脱系メッセージが出る

    ■ 調査ポイント
    - battle/assets/js/main.js 内で以下のキーワードを grep せよ:
      「離脱」「強制離脱」「forfeit」「leave」「abandon」
    - news.json 2025/05/08 エントリに「途中離脱を敗北とするようにしました」とあり、
      離脱判定ロジックが **初回ロード時に既存戦闘の残骸（Firestore上の中断戦闘）を検出してしまっている** 可能性が高い
    - 想定原因候補:
      (a) Firestore 上に残っている「進行中戦闘」ドキュメントを初回ロードで検知 → 離脱判定が発火
      (b) ログイン直後の戦闘復元処理が null チェック不足で警告を出している
      (c) localStorage / sessionStorage の前回セッションが残っていて再読込時に離脱扱い
      (d) Firestore の onSnapshot リスナーが初期化時に発火し、過去の戦闘状態を「今離脱した」と誤判定
    - 軍B が tcmd_111 でリファクタしたばかりなので、リファクタ副作用の可能性も高い
      （main.js 1935→60行分割時にライフサイクル順序が変わっている可能性）

    ■ 実装方針
    1. **再現**: Playwright MCP で本番 https://camp-schedule-app.vercel.app/battle/ を
       （未ログイン→ログイン→バトル画面）の順で開き、実際にメッセージが出るか確認・スクショ。
       日本語フォント導入済みなので豆腐化しないはず。
       ※ 認証が必要で Playwright で入れない場合は、コード解析ベースで発火パスを特定してもよい。
    2. **原因特定**: Console / Network / コードリーディングで発火元を特定。
       コメントか報告に「原因: xxx（ファイル:行）」を明記せよ。
    3. **最小パッチで修正**:
       - 「初回ロード時は離脱判定をスキップ」
       - 「前回セッションの残骸は無視」
       - 「onSnapshot の初回発火は state だけ同期してメッセージは出さない」
       …等、副作用を最小にする方針を選べ。
    4. **再検証**: 修正後、Playwright または静的論証で再現しないことを確認。
       Playwright 実機確認できる場合はスクショ1枚以上。

